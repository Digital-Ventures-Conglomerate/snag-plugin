name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.325

      - name: Validate plugin and marketplace (strict)
        run: claude plugin validate --strict .

      # This repo is public: nothing internal or secret may ever land in it.
      - name: No internal URLs or tokens
        run: |
          if git grep -nE 'mcp\.dev\.snag\.ac|\.run\.app|Bearer mcp_|mcp_[A-Za-z0-9_-]{8,}' -- . ':!.github/workflows/validate.yml'; then
            echo "::error::internal URL or token-shaped string found"
            exit 1
          fi
